# Production Worker contract for the Feishu Add-on.
# Resource UUIDs are applied by the deploy overlay; this file pins names and bindings only.

name = "pastebin-feishu-prod"
main = "worker/index.ts"
compatibility_date = "2026-07-01"
# Public Paste URLs stay on PASTEBIN_ORIGIN (pb.223.im). Internal Paste HTTP uses
# PASTEBIN_SERVICE → pastebin-prod. Keep this flag during the transport transition.
compatibility_flags = ["global_fetch_strictly_public"]
workers_dev = true

# Persist existing PASTE_CREATE_STAGE console.log output (queue consumers included).
# Full sample is required: this Worker is low-traffic and a single P2P must not be dropped.
# Production overlays that replace this file MUST keep the observability block.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1

[assets]
directory = "./dist/frontend"
binding = "ASSETS"
run_worker_first = true

[vars]
PASTEBIN_ORIGIN = "https://pb.223.im"
# Exact value feishu | lark. Overlays may set PLATFORM=lark and must then
# supply LARK_* provider credentials. Do not put Lark secrets in FEISHU_*.
PLATFORM = "feishu"
FEISHU_INGRESS_DLQ_CONFIGURED = "false"

[[d1_databases]]
binding = "FEISHU_BINDINGS_DB"
database_name = "pastebin-feishu-prod"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "./migrations"

[[queues.producers]]
binding = "FEISHU_INGRESS_QUEUE"
queue = "pastebin-feishu-ingress-prod"

[[queues.consumers]]
queue = "pastebin-feishu-ingress-prod"
max_retries = 5
dead_letter_queue = "pastebin-feishu-ingress-dlq-prod"

[[services]]
binding = "PASTEBIN_SERVICE"
service = "pastebin-prod"
